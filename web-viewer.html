<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Viewer — Web Watch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0a0a0f; color: #e8e8f0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(10,10,15,0.92); z-index: 10; transition: opacity 0.4s;
    padding: 24px; text-align: center;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: 1px; }
  h1 span { color: #5af; }
  p.sub { color: #8888a0; font-size: 14px; max-width: 420px; line-height: 1.5; }
  #code-row { display: flex; gap: 10px; align-items: center; }
  #code-input {
    font-size: 22px; padding: 12px 16px; width: 220px; text-align: center;
    background: #16161f; border: 2px solid #33334a; border-radius: 10px;
    color: #fff; letter-spacing: 2px; text-transform: uppercase; outline: none;
  }
  #code-input:focus { border-color: #5af; }
  button {
    font-size: 18px; padding: 12px 28px; border: none; border-radius: 10px;
    background: #2a6af0; color: #fff; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #3a7af5; }
  button:disabled { background: #33334a; cursor: default; }
  button.ghost { background: transparent; border: 1px solid #44445a; font-size: 14px; padding: 8px 18px; }
  #status { font-size: 14px; color: #8888a0; min-height: 20px; }
  #status.ok { color: #4d4; }
  #status.err { color: #f66; }
  #status.warn { color: #fc6; }
  #controls {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: center; gap: 10px; padding: 12px;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    opacity: 0; transition: opacity 0.3s;
  }
  #controls.show { opacity: 1; }
  #controls button { font-size: 14px; padding: 8px 16px; }
  #unmute-banner {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: #2a6af0; padding: 10px 22px; border-radius: 24px;
    font-size: 15px; cursor: pointer; z-index: 20; display: none;
    box-shadow: 0 4px 18px rgba(42,106,240,0.5);
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline></video>
</div>

<div id="overlay">
  <h1>P2P <span>VIEWER</span></h1>
  <p class="sub">Enter the host's 6-character code to watch their screen.<br>
  Tip: add <code>?code=PV-XXXXXX</code> to this page's URL to pre-fill it — handy for Second Life shared media.</p>
  <div id="code-row">
    <input id="code-input" maxlength="9" placeholder="PV-XXXXXX" autocomplete="off" spellcheck="false">
    <button id="btn-connect">Connect</button>
  </div>
  <div id="status"></div>
</div>

<div id="unmute-banner">🔊 Click to enable sound</div>

<div id="controls">
  <button id="btn-mute" class="ghost">🔊 Mute</button>
  <button id="btn-full" class="ghost">⛶ Fullscreen</button>
  <button id="btn-leave" class="ghost">Disconnect</button>
</div>

<script src="https://unpkg.com/livekit-client@2.22.3/dist/livekit-client.umd.js"></script>
<script>
(function() {
  'use strict';
  var TOKEN_WORKER_URL = 'https://p2p-token.sieyes-dev.workers.dev/token';
  var $ = function(id) { return document.getElementById(id); };
  var overlay = $('overlay'), status = $('status'), video = $('video');
  var codeInput = $('code-input'), btnConnect = $('btn-connect');
  var controls = $('controls'), unmuteBanner = $('unmute-banner');
  var room = null, audioEl = null, muted = false, hideTimer = null, gotVideo = false;

  function setStatus(msg, kind) {
    status.textContent = msg || '';
    status.className = kind || '';
  }

  function normalizeCode(raw) {
    var code = String(raw || '').trim().toUpperCase().replace(/[^A-Z0-9-]/g, '');
    if (code && !code.startsWith('PV-')) code = 'PV-' + code;
    return code;
  }

  // Pre-fill from ?code= param
  try {
    var params = new URLSearchParams(window.location.search);
    var preset = normalizeCode(params.get('code'));
    if (preset) codeInput.value = preset;
  } catch (e) {}

  function showControls() {
    controls.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function() { controls.classList.remove('show'); }, 3000);
  }
  document.addEventListener('mousemove', function() {
    if (!overlay.classList.contains('hidden')) return;
    showControls();
  });

  function teardown() {
    if (room) { try { room.disconnect(); } catch (e) {} room = null; }
    if (audioEl) { audioEl.remove(); audioEl = null; }
    video.srcObject = null;
    gotVideo = false;
    overlay.classList.remove('hidden');
    controls.classList.remove('show');
    unmuteBanner.style.display = 'none';
    btnConnect.disabled = false;
  }

  function attachTrack(track) {
    if (track.kind === LivekitClient.Track.Kind.Video) {
      track.attach(video);
      video.muted = false;
      var p = video.play();
      if (p && typeof p.catch === 'function') {
        p.catch(function() {
          // Autoplay blocked — show unmute banner (common in embedded browsers like SL)
          unmuteBanner.style.display = 'block';
          video.muted = true;
          video.play().catch(function(){});
        });
      }
      gotVideo = true;
      overlay.classList.add('hidden');
      setStatus('');
      showControls();
    } else if (track.kind === LivekitClient.Track.Kind.Audio) {
      if (!audioEl) {
        audioEl = document.createElement('audio');
        audioEl.autoplay = true;
        document.body.appendChild(audioEl);
      }
      track.attach(audioEl);
    }
  }

  async function connect(code) {
    if (room) return;
    var roomName = code.toLowerCase();
    setStatus('Connecting to relay…');
    btnConnect.disabled = true;

    var r = new LivekitClient.Room({ adaptiveStream: true });
    room = r;

    r.on(LivekitClient.RoomEvent.TrackSubscribed, function(track) { attachTrack(track); });
    r.on(LivekitClient.RoomEvent.Disconnected, function() {
      if (room === r) { setStatus('Disconnected from relay.', 'warn'); teardown(); }
    });
    r.on(LivekitClient.RoomEvent.ParticipantDisconnected, function() {
      if (room === r && r.remoteParticipants.size === 0 && gotVideo) {
        setStatus('Host ended the stream.', 'warn');
        teardown();
      }
    });

    try {
      var tr = await fetch(TOKEN_WORKER_URL + '?room=' + encodeURIComponent(roomName) +
        '&name=viewer&role=viewer');
      if (!tr.ok) throw new Error('token server returned ' + tr.status);
      var j = await tr.json();
      if (!j.token || !j.url) throw new Error('bad token response');
      if (room !== r) return;
      await r.connect(j.url, j.token);
      // Attach tracks published before we joined.
      r.remoteParticipants.forEach(function(p) {
        p.trackPublications.forEach(function(pub) { if (pub.track) attachTrack(pub.track); });
      });
      if (!gotVideo) setStatus('Connected — waiting for host video…');
      setTimeout(function() {
        if (room === r && !gotVideo) {
          setStatus('No video yet — the host may not be live. Check the code.', 'warn');
        }
      }, 15000);
    } catch (e) {
      setStatus('Connection failed: ' + (e.message || e), 'err');
      teardown();
    }
  }

  btnConnect.addEventListener('click', function() {
    var code = normalizeCode(codeInput.value);
    if (code.length < 6) { setStatus('Enter the host code first.', 'warn'); return; }
    connect(code);
  });
  codeInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') btnConnect.click();
  });

  unmuteBanner.addEventListener('click', function() {
    video.muted = false;
    if (audioEl) audioEl.muted = false;
    video.play().catch(function(){});
    unmuteBanner.style.display = 'none';
  });

  $('btn-mute').addEventListener('click', function() {
    muted = !muted;
    video.muted = muted;
    if (audioEl) audioEl.muted = muted;
    this.textContent = muted ? '🔇 Unmute' : '🔊 Mute';
    showControls();
  });
  $('btn-full').addEventListener('click', function() {
    var el = document.documentElement;
    if (document.fullscreenElement) { document.exitFullscreen().catch(function(){}); }
    else if (el.requestFullscreen) { el.requestFullscreen().catch(function(){}); }
    showControls();
  });
  $('btn-leave').addEventListener('click', function() {
    teardown();
    setStatus('Disconnected.');
  });
})();
</script>
</body>
</html>
